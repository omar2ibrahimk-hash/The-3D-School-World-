/* OPEN SCHOOL EXPANSION: teachers, principal, students and living campus routines */
(function(){
  const extraStaff=[
    ['Principal Khan',-6,9,0x7b3f00,'Principal Office',['Welcome to our school!','Please check the timetable before your next class.']],
    ['Ms. Priya',-14,7,0x8b4aa8,'Science Teacher',['Today we are exploring science.','Remember to record your observations.']],
    ['Mr. Daniel',-8,-7,0x245b9b,'English Teacher',['Keep your reading book ready.','Good writing starts with good ideas.']],
    ['Ms. Aisha',4,-7,0x238b57,'Computer Teacher',['Welcome to coding class.','Try the coding puzzle in the lab.']],
    ['Coach Arjun',0,28,0xb52b2b,'Sports Teacher',['Warm up before sports.','The field is open during sports period.']]
  ];
  const students=[
    ['Alex',-15,5],['Riya',-11,5],['Kabir',-7,5],['Sara',-3,5],
    ['Adam',3,5],['Zoya',7,5],['Leo',11,5],['Mia',15,5],

  function safePerson(name,x,z,shirt,role){
    if(typeof person!=='function'||typeof sc==='undefined') return null;
    const g=new THREE.Group();
    try{ person(g,M(shirt),M(0x2b2119)); }catch(e){return null}
    g.position.set(x,0,z); sc.add(g);

  const extras=[];
  extraStaff.forEach(a=>{

    if(n){n.l=a[5];n.homeX=a[1];n.homeZ=a[2];n.speed=.35;extras.push(n);}

    const n=safePerson(a[0],a[1],a[2],0x3b6fa8,'Student');

<script>

(function(){
  if(window.__verticalUpgrade) return;
  window.__verticalUpgrade=true;
  const elevators=[], drops=[], H=3.9;

  function addV(x,y,z,w,h,d,c){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
      new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.2}));
    m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; sc.add(m); return m;
  }

    const g=cv.getContext('2d'); g.fillStyle='rgba(10,18,32,.9)'; g.fillRect(0,0,512,128);
    g.fillStyle='#ffc43d'; g.font='bold 42px system-ui'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(t,256,64);
    const tx=new THREE.CanvasTexture(cv);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(2.8,.7),
      new THREE.MeshBasicMaterial({map:tx,transparent:true}));
    m.position.set(x,y,z); m.rotation.x=-Math.PI/2; sc.add(m);
  }

  /* Elevator immediately beside the escalator area on every upper floor. */
  for(let f=1;f<=7;f++){
    const y=f*H, x=10.1, z=6.2;
    addV(x,y+.15,z,3.1,.3,2.8,0x263a52);
    addV(x-1.35,y+1.6,z,.08,2.8,2.8,0x6f8298);
    addV(x+1.35,y+1.6,z,.08,2.8,2.8,0x6f8298);
    addV(x,y+3,z-1.35,3.1,2.8,.08,0x6f8298);
    addV(x-.52,y+1.35,z+1.37,.9,2.4,.06,0x7dd8ff);
    addV(x+.52,y+1.35,z+1.37,.9,2.4,.06,0x7dd8ff);
    sign('ELEVATOR • FLOOR '+f,x,y+3.25,z);
    elevators.push({x,z,y,f});
  }

  /* Low barrier beside escalators: jump over it to drop to the floor below. */
  for(let f=2;f<=7;f++){
    const y=f*H, x=12.7, z=5;
    addV(x,y+.55,z-1.25,2.2,1.1,.12,0xffc43d);
    addV(x,y+.55,z+1.25,2.2,1.1,.12,0xffc43d);
    addV(x-1.05,y+.55,z,.12,1.1,2.5,0xffc43d);

  }

  function near(list,max){
    if(!window.P) return null;
    let best=null,bd=max;
    for(const o of list){
      const d=Math.hypot(P.position.x-o.x,P.position.z-o.z);
      if(d<bd){bd=d;best=o;}
    }
    return best;
  }

  const oldInteract=window.interact;
  window.interact=function(){
    if(window.st!=='ok') return;

    const e=near(elevators,2.8);
    if(e){
      let current=Math.max(1,Math.min(7,Math.round(P.position.y/H)));
      let next=current+1; if(next>7) next=1;
      P.position.y=next*H+.35;
      if(typeof vy!=='undefined') vy=0;
      if(typeof snd==='function') snd(520,.16,'triangle',.2);
      if(typeof tip==='function') tip('Elevator → Floor '+next);
      return;
    }

    const d=near(drops,2.8);
    if(d && P.position.y>d.y-.9){
      P.position.y=Math.max(.35,(d.f-1)*H+.35);
      if(typeof vy!=='undefined') vy=-2;
      if(typeof shake!=='undefined') shake=Math.max(shake,.12*(S.sh||1));
      if(typeof tip==='function') tip('Jumped down beside the escalator!');
      if(typeof snd==='function') snd(180,.18,'sine',.15);
      return;
    }

    if(oldInteract) oldInteract();
  };
})();
</script>


<script>
/* Final campus expansion: more floors, buildings, window jumps, and working descent. */
(function(){
  if(window.__finalCampusExpansion) return;
  window.__finalCampusExpansion=true;

  const H=3.9;

  /* Make the existing main tower support 8 usable floors. */
  const oldGY=window.gY;
  window.gY=function(x,z,y){
    const r=window.rampAt ? window.rampAt(x,z,y) : -1;
    if(r>=0) return Math.min(8*H, 3.9*r+(9-z)/8*3.9);
    if(y>3 && Math.abs(x)<20 && Math.abs(z)<12)
      return Math.min(8*H, Math.max(0,Math.floor((y+.3)/H))*H);
    return 0;
  };

  const oldRamp=window.rampAt;
  window.rampAt=function(x,z,y){
    if(z>1&&z<9) for(let r=0;r<8;r++){
      const a=r%2?13.2:16.4;
      if(x>a&&x<a+2.2){
        const sf=Math.min(H*(r+1),H*r+(9-z)/8*H);
        if(y>=sf-.35&&y<=sf+.9) return r;
      }
    }
    return -1;
  };

  function addBox(x,y,z,w,h,d,c,solid){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
      new THREE.MeshLambertMaterial({color:c}));
    m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; sc.add(m);
    if(solid && window.cols) cols.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,h:y+h/2,y0:y-h/2});
    return m;
  }
  function label(text,x,y,z,rot=0){
    const c=document.createElement('canvas'); c.width=640;c.height=120;
    const g=c.getContext('2d');g.fillStyle='rgba(8,15,28,.92)';g.fillRect(0,0,640,120);
    g.fillStyle='#7fe7ff';g.font='bold 42px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(text,320,60);
    const t=new THREE.CanvasTexture(c);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(4.2,.8),
      new THREE.MeshBasicMaterial({map:t,transparent:true}));
    m.position.set(x,y,z);m.rotation.x=-Math.PI/2;m.rotation.z=rot;sc.add(m);
  }

  /* Four new campus buildings with 3 floors each. */
  const newBuildings=[
    {name:'SCIENCE & TECHNOLOGY CENTER',x:-34,z:34,w:14,d:10,c:0x547a9b},
    {name:'LIBRARY & MEDIA CENTER',x:34,z:32,w:14,d:10,c:0x8066a0},
    {name:'STUDENT ACTIVITY CENTER',x:-33,z:-36,w:15,d:10,c:0x4e8a72},
    {name:'ARTS & MUSIC HALL',x:33,z:-36,w:15,d:10,c:0xa06b55}
  ];

  newBuildings.forEach((b,bi)=>{
    for(let f=0;f<3;f++){
      const y=f*H;
      addBox(b.x,y-.12,b.z,b.w,.2,b.d,0x9b8060);
      /* corner pillars + perimeter walls, leaving a front entrance */
      addBox(b.x-b.w/2,y+1.8,b.z-b.d/2,.35,3.6,.35,b.c,true);
      addBox(b.x+b.w/2,y+1.8,b.z-b.d/2,.35,3.6,.35,b.c,true);
      addBox(b.x-b.w/2,y+1.8,b.z+b.d/2,.35,3.6,.35,b.c,true);
      addBox(b.x+b.w/2,y+1.8,b.z+b.d/2,.35,3.6,.35,b.c,true);
      addBox(b.x,y+1.8,b.z-b.d/2,(b.w-2.8),3.6,.3,b.c,true);
      addBox(b.x-b.w/2,y+1.8,b.z,.3,3.6,b.d,b.c,true);
      addBox(b.x+b.w/2,y+1.8,b.z,.3,3.6,b.d,b.c,true);
      /* windows */
      for(let wx=-2;wx<=2;wx+=2){
        addBox(b.x+wx*2.0,y+2.0,b.z+b.d/2+.18,1.35,1.2,.08,0x7bdcff);
      }
      label(b.name+' • FLOOR '+(f+1),b.x,y+3.72,b.z);
    }
    /* rooftop feature */
    addBox(b.x,3*H+.35,b.z,b.w-.8,.7,b.d-.8,0x303b52);
    label('ROOFTOP',b.x,3*H+1.0,b.z);

    /* Interior vertical elevator shaft */
    addBox(b.x+b.w/2-1.4,1.5,b.z-b.d/2+1.5,2.1,3.0,2.1,0x4a5968,true);
    label('LIFT',b.x+b.w/2-1.4,1.9,b.z-b.d/2+1.5);
  });

  /* Safe window-jump points: jump at a marked upper-floor window to descend outside. */
  const windowJumps=[];
  newBuildings.forEach((b,bi)=>{
    for(let f=1;f<3;f++){
      windowJumps.push({x:b.x-4,z:b.z+b.d/2+.5,y:f*H,f,b});
      windowJumps.push({x:b.x+4,z:b.z+b.d/2+.5,y:f*H,f,b});
    }
  });
  /* Main tower window exits on the front side. */
  for(let f=1;f<=8;f++){
    windowJumps.push({x:-10,z:-12.7,y:f*H,f,b:{name:'MAIN SCHOOL'}});
    windowJumps.push({x:10,z:-12.7,y:f*H,f,b:{name:'MAIN SCHOOL'}});
  }

  function nearest(list,max){
    if(!window.P) return null;
    let best=null,bd=max;
    for(const o of list){
      const d=Math.hypot(P.position.x-o.x,P.position.z-o.z);
      if(d<bd && Math.abs(P.position.y-o.y)<1.7){bd=d;best=o;}
    }
    return best;
  }

  /* Replace elevator interaction with a clear up/down cycle.
     Use on an elevator: floors advance upward; on the top floor they descend.
     A second dedicated down interaction is also available at marked lift exits. */
  const lifts=[];
  newBuildings.forEach(b=>{
    for(let f=0;f<3;f++) lifts.push({x:b.x+b.w/2-1.4,z:b.z-b.d/2+1.5,f,b});
  });
  for(let f=0;f<=8;f++) lifts.push({x:10.1,z:6.2,y:f*H,f,b:{name:'MAIN SCHOOL'}});

  window.interact=function(){
    if(window.st!=='ok') return;

    const w=nearest(windowJumps,2.6);
    if(w){
      /* Jump through the marked window to the floor/ground below. */
      const target=Math.max(0,(w.f-1)*H+.35);
      P.position.y=target;
      P.position.z=w.z-1.4;
      if(typeof vy!=='undefined') vy=-3;
      if(typeof shake!=='undefined') shake=Math.max(shake,.14*(S.sh||1));
      if(typeof tip==='function') tip('Jumped through the window → Floor '+Math.max(1,w.f));
      if(typeof snd==='function') snd(170,.18,'sine',.18);
      return;
    }

    /* Main elevator: if below top, go up; at top, start coming down. */
    const e=nearest(lifts,2.8);
    if(e){
      let current=Math.max(0,Math.min(8,Math.round(P.position.y/H)));
      let next=current<8?current+1:current-1;
      next=Math.max(0,next);
      P.position.y=next*H+.35;
      if(typeof vy!=='undefined') vy=0;
      if(typeof tip==='function') tip('Elevator → Floor '+(next===0?'Ground':next));
      if(typeof snd==='function') snd(next>current?560:240,.16,'triangle',.18);
      return;
    }

    /* Fall back to the original interaction system for NPCs/activities. */
    if(typeof window.__oldSchoolInteract==='function') window.__oldSchoolInteract();
  };

  /* Preserve the interaction function that existed before this final patch. */
  if(!window.__oldSchoolInteract && typeof oldInteract==='function') window.__oldSchoolInteract=oldInteract;

  /* A visible instruction near the jump points. */
  window.addEventListener('keydown',function(e){
    if(e.code==='KeyE' && window.st==='ok'){
      const w=nearest(windowJumps,2.6);
      if(w) window.interact();
    }
  });

  /* Add a few outdoor landmarks and sky bridges for a larger campus feel. */
  const landmarks=[
    [-24,0,0x27384d,'SPORTS COMPLEX'],
    [24,0,0x3d304d,'INNOVATION HUB'],
    [0,35,0x314b3b,'CAMPUS GARDEN']
  ];
  landmarks.forEach(([x,z,c,t],i)=>{
    addBox(x,.35,z,9,.7,6,c);
    label(t,x,1.0,z);
  });

  if(typeof tip==='function') tip('Campus expanded: new buildings, floors, elevators and window exits!');
})();
</script>
